# Modest heap: the dev machine has 8 GB.
# This Mac's only nameserver is an IPv6 link-local address, which Gradle's
# resolver cannot use; IPv4 keeps dependency downloads working.
org.gradle.jvmargs=-Xmx1536m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
