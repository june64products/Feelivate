name: Android

# Every push to the android branch that touches the app builds the optimised
# release APK (signed with the shared debug key, so testers' phones update in
# place) and hands it to Firebase App Distribution, which notifies the phones.
# When the Play upload keystore is in the repo's secrets, the same run also
# builds the signed App Bundle for the Play Console and keeps it as an artifact.
#
# Auth is keyless: GitHub's OIDC token is exchanged for a short-lived Google
# access token through Workload Identity Federation (pool "github" on the
# Firebase project), impersonating the project's Firebase service account.
on:
  push:
    branches: ["android"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write     # to restart the FCM token relay chain

env:
  FIREBASE_PROJECT_NUMBER: "980030853864"
  WIF_PROVIDER: projects/980030853864/locations/global/workloadIdentityPools/github/providers/github
  WIF_SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@feelivate.iam.gserviceaccount.com
  # Play upload signing; empty until the secret exists, which skips the bundle steps.
  RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

jobs:
  build:
    # The federation only trusts this repository; mirrors on other remotes skip the job.
    if: github.repository == 'june64products/Feelivate'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.ref != 'refs/heads/android' }}

      # The same debug keystore as the dev Mac, so phones update in place and
      # the SHA-1 registered for Google Sign-In keeps matching.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK for testers (debug-signed)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Push notifications. Both are embedded in any shipped APK anyway;
          # they live in secrets so the repo doesn't carry project identifiers.
          # Missing values just leave push off — the build still succeeds.
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          # Offset keeps cloud builds above any APK built by hand on the Mac (versionCode 1).
          # No -PreleaseStoreFile here → the release build type signs with the debug key.
          gradle assembleRelease --no-daemon --console=plain \
            -PversionCode=$((100 + ${{ github.run_number }})) \
            -PversionName=1.0.${{ github.run_number }} \
            -PgoogleWebClientId="$GOOGLE_WEB_CLIENT_ID" \
            -PfirebaseAppId="$FIREBASE_APP_ID" \
            -PfirebaseApiKey="$FIREBASE_API_KEY"
          cp app/build/outputs/apk/release/app-release.apk "feelivate-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-testers-1.0.${{ github.run_number }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: feelivate-1.0.${{ github.run_number }}
          path: |
            android/feelivate-1.0.${{ github.run_number }}.apk
            android/mapping-testers-1.0.${{ github.run_number }}.txt
          retention-days: 14

      # ── Play Store ──
      # Only when the upload keystore is configured. The bundle is signed with
      # it and kept as a 90-day artifact: download, then upload in Play Console.
      - name: Build signed App Bundle for Play
        if: env.RELEASE_KEYSTORE_B64 != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$HOME/feelivate-upload.jks"
          gradle bundleRelease --no-daemon --console=plain \
            -PversionCode=$((100 + ${{ github.run_number }})) \
            -PversionName=1.0.${{ github.run_number }} \
            -PgoogleWebClientId="$GOOGLE_WEB_CLIENT_ID" \
            -PfirebaseAppId="$FIREBASE_APP_ID" \
            -PfirebaseApiKey="$FIREBASE_API_KEY" \
            -PreleaseStoreFile="$HOME/feelivate-upload.jks" \
            -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias=feelivate \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "feelivate-play-1.0.${{ github.run_number }}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-play-1.0.${{ github.run_number }}.txt"
          rm -f "$HOME/feelivate-upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_B64 != ''
        with:
          name: feelivate-play-1.0.${{ github.run_number }}
          path: |
            android/feelivate-play-1.0.${{ github.run_number }}.aab
            android/mapping-play-1.0.${{ github.run_number }}.txt
          retention-days: 90

      - id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Send to phones (Firebase App Distribution)
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          APK: feelivate-1.0.${{ github.run_number }}.apk
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          set -euo pipefail
          API="https://firebaseappdistribution.googleapis.com"
          APP="projects/$FIREBASE_PROJECT_NUMBER/apps/$APP_ID"

          # 1. Upload the binary; the API answers with a long-running operation.
          OP=$(curl -sS -X POST "$API/upload/v1/$APP/releases:upload" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: $APK" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          echo "operation: $OP"

          # 2. Wait for processing to finish and pick up the release name.
          for i in $(seq 1 60); do
            BODY=$(curl -sS "$API/v1/$OP" -H "Authorization: Bearer $TOKEN")
            if echo "$BODY" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("done") else 1)'; then break; fi
            sleep 5
          done
          echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "error" not in d, d'
          RELEASE=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["response"]["release"]["name"])')
          echo "release: $RELEASE"

          # 3. Release notes = the commit message, then hand it to the testers group.
          python3 -c 'import json,os; print(json.dumps({"releaseNotes": {"text": os.environ["NOTES"]}}))' > notes.json
          curl -sS -o /dev/null -w "notes: %{http_code}\n" -X PATCH "$API/v1/$RELEASE?updateMask=releaseNotes.text" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @notes.json
          curl -sS -o /dev/null -w "distribute: %{http_code}\n" -X POST "$API/v1/$RELEASE:distribute" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"groupAliases": ["testers"]}'

      - name: Restart the FCM token relay chain
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fcm-relay.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}"
